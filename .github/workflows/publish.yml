name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        run: dotnet pack src/Liviate.Rag/Liviate.Rag.csproj --configuration Release --output ./nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write  # required for NuGet Trusted Publishing (OIDC) -- no long-lived API key stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./nupkg

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
